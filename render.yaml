services:
  # =========================================================================
  # 1. HIREMIND EXPRESS BACKEND WEB SERVICE
  # =========================================================================
  - type: web
    name: hiremind-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      # Admin login (seeded on startup). Set a strong password (12+ chars) in the Render dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public HTTPS URL of the AI service, e.g. https://hiremind-ai-service.onrender.com
      # (Render free-plan services cannot reach each other over the private network,
      #  so the internal "host" property must NOT be used here.)
      - key: AI_SERVICE_URL
        sync: false
      # Shared secret sent to the AI service; generated here and copied to the AI service below
      - key: AI_SERVICE_API_KEY
        generateValue: true
      # Public backend URL (BACKEND_URL) is optional: Render provides RENDER_EXTERNAL_URL automatically.
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: hire-mind
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: HireMind Team <noreply@hiremind.com>
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # =========================================================================
  # 2. HIREMIND AI SERVICE (FASTAPI + GOOGLE ADK) WEB SERVICE
  # =========================================================================
  - type: web
    name: hiremind-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PROVIDER
        value: openrouter
      - key: aimodel
        value: qwen/qwen-2.5-72b-instruct
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.0-flash
      - key: STT_MODEL
        value: openai/whisper-large-v3-turbo
      - key: TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: TTS_VOICE
        value: Puck
      - key: ENVIRONMENT
        value: production
      # Must match the backend's AI_SERVICE_API_KEY (requests without it are rejected)
      - key: AI_SERVICE_API_KEY
        fromService:
          type: web
          name: hiremind-backend
          envVarKey: AI_SERVICE_API_KEY
